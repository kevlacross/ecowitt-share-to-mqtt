<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecowitt share to MQTT</title><style>body{font:15px system-ui;margin:auto;max-width:1000px;padding:24px;background:#10161d;color:#e6edf3}section{background:#17212b;padding:18px;margin:14px 0;border-radius:10px}input,select{padding:8px;margin:4px;width:min(100%,360px)}button{padding:8px 12px;margin:4px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #304050;text-align:left}.ok{color:#4ade80}.bad{color:#fb7185}</style><body><h1>Ecowitt share to MQTT</h1><p id="status">Lade Status…</p><section><h2>MQTT &amp; Anzeige</h2><input id="host" placeholder="Broker Host"><input id="port" type="number" placeholder="1883"><input id="user" placeholder="Benutzer"><input id="pass" type="password" placeholder="Passwort (leer = unverändert)"><input id="topic" placeholder="ecowitt_share"><input id="discovery" placeholder="homeassistant"><label><input id="tls" type="checkbox" style="width:auto"> TLS</label><label>Sensor-Sprache <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label><br><button onclick="saveSettings()">Speichern</button><button onclick="testMqtt()">Verbindung testen</button><span id="mqttmsg"></span><p>Die Sprache wird beim nächsten Synchronisieren auf automatisch erkannte Standardnamen angewendet. Eigene Sensornamen bleiben erhalten.</p></section><section><h2>Station hinzufügen</h2><input id="stationName" placeholder="Name, z. B. Garten"><input id="shareUrl" placeholder="Ecowitt Share-URL"><input id="interval" type="number" value="60" min="30"><button onclick="addStation()">Speichern</button></section><section><h2>Stationen</h2><div id="stations"></div></section><script src="app.js"></script></body></html>
